<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background - dark navy -->
  <rect x="4" y="4" width="92" height="92" rx="22" ry="22" fill="#0f0f1a"/>

  <!-- Subtle violet border -->
  <rect x="4" y="4" width="92" height="92" rx="22" ry="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>

  <!-- Bold letter T with gradient + glow -->
  <text
    x="50" y="73"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="900"
    fill="url(#grad)"
    filter="url(#glow)"
  >T</text>
</svg>
